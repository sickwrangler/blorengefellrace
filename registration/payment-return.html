<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment status | Blorenge Fell Race</title>
  <meta name="description" content="Check the payment status of a Blorenge Fell Race entry.">
  <link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="prototype.css">
  <link rel="icon" href="/images/blorenge_fellrace_logo_white.svg" type="image/svg+xml">
  <script type="module" src="payment-return.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="prototype-header"><a href="index.html">← Registration</a><span class="environment-status">Development · Payments unavailable</span></header>
  <main id="main-content" class="prototype-shell">
    <h1>Payment status</h1>
    <section class="prototype-card" aria-labelledby="payment-status-title">
      <p class="eyebrow">2026 race entry</p>
      <h2 id="payment-status-title">Checking payment status…</h2>
      <p id="payment-status-message" aria-live="polite">Please wait while we check the authoritative server record.</p>
      <div id="payment-actions" class="form-actions" hidden>
        <button id="retry-payment" class="button" type="button">Retry payment</button>
        <button id="request-refund" class="button button--quiet" type="button" hidden>Request full refund</button>
        <button id="refresh-payment" class="button button--quiet" type="button">Refresh status</button>
      </div>
      <p id="payment-help" hidden><a href="../enter.html">Return to entry information</a></p>
    </section>
  </main>
</body>
</html>
