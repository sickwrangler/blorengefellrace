<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blorenge Fell Race navigation</title>
  <link rel="stylesheet" href="/style.css">
  <link href="https://fonts.googleapis.com/css?family=Inter" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Suez+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="navbar.css">
</head>
<body>
  <nav class="navbar" aria-label="Primary navigation">
    <h1 class="brand-heading">
      <a class="brand" href="/index.html" target="_top" aria-label="Blorenge Fell Race home">
        <img class="logo_navbar" src="/images/blorenge_fellrace_logo.svg" width="418" height="237" alt="Blorenge Fell Race logo">
        <span class="brand__name">Blorenge fell race</span>
      </a>
    </h1>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-links">Menu</button>
    <ul class="nav-links" id="primary-links">
      <li><a href="/enter.html" target="_top">Enter</a></li>
      <li><a href="/result.html" target="_top">Results</a></li>
      <li><a href="/route.html" target="_top">Route</a></li>
      <li><a href="/info.html" target="_top">Info</a></li>
    </ul>
  </nav>
  <script>
    const nav = document.querySelector('.navbar');
    const toggle = document.querySelector('.menu-toggle');
    const links = document.querySelectorAll('.nav-links a');
    const mobile = window.matchMedia('(max-width: 47.99rem)');

    function notifyHeight() {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      window.parent.postMessage({
        type: 'blorenge-nav-height',
        height: mobile.matches && expanded ? 190 : (mobile.matches ? 72 : 84)
      }, window.location.origin);
    }

    const currentPath = window.parent.location.pathname.replace(/\/$/, '/index.html');
    links.forEach((link) => {
      if (link.getAttribute('href') === currentPath) link.setAttribute('aria-current', 'page');
    });

    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      toggle.textContent = expanded ? 'Menu' : 'Close';
      nav.classList.toggle('is-open', !expanded);
      notifyHeight();
    });

    mobile.addEventListener('change', () => {
      toggle.setAttribute('aria-expanded', 'false');
      toggle.textContent = 'Menu';
      nav.classList.remove('is-open');
      notifyHeight();
    });
    notifyHeight();
  </script>
</body>
</html>
