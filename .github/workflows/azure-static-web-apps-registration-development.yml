name: Registration development Azure Static Web App

on:
  workflow_dispatch:
  push:
    branches:
      - codex/development
    paths:
      - "api/**"
      - "registration/**"
      - "components/**"
      - "data/photos/**"
      - "data/public/**"
      - "downloads/**"
      - "images/**"
      - "*.html"
      - "*.js"
      - "*.css"
      - "scripts/stage-deployment-artifacts.mjs"
      - "scripts/validate-*.mjs"
      - "tests/**"
      - "staticwebapp.config.json"
      - ".github/workflows/azure-static-web-apps-registration-development.yml"

permissions:
  contents: read

concurrency:
  group: registration-development
  cancel-in-progress: true

jobs:
  validate_and_deploy:
    runs-on: ubuntu-latest
    environment: registration-development
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate and stage development registration system
        run: |
          npm ci --prefix api --ignore-scripts
          node scripts/validate-site.mjs
          node scripts/validate-registration.mjs
          node --test tests/registration.test.mjs tests/registration-phase2.test.mjs tests/deployment-artifacts.test.mjs
          node scripts/validate-route.mjs
          node scripts/validate-photos.mjs
          node scripts/stage-deployment-artifacts.mjs development

      - name: Deploy isolated registration development app
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_REGISTRATION_DEVELOPMENT }}
          action: upload
          app_location: ".deployment/development/app"
          api_location: ".deployment/development/api"
          output_location: ""
          skip_app_build: true
