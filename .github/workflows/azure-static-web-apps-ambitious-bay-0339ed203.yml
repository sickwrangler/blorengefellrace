name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate and stage the exact CLOSED production artifact
        run: |
          npm ci --prefix api --ignore-scripts
          npm ci --prefix scheduler --ignore-scripts
          node scripts/validate-site.mjs
          node scripts/validate-registration.mjs
          node scripts/validate-route.mjs
          node scripts/validate-photos.mjs
          node scripts/validate-public-results.mjs
          node --test tests/*.test.mjs
          node scripts/simulate-registration-production.mjs
          node scripts/stage-deployment-artifacts.mjs production-registration
          node scripts/stage-registration-production-scheduler.mjs
      - name: Deploy allowlisted production artifact
        if: github.event_name == 'push'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_BAY_0339ED203 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ".deployment/production-registration/app"
          api_location: ".deployment/production-registration/api"
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_BAY_0339ED203 }}
          action: "close"
